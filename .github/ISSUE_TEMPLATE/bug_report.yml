name: Bug report
description: Report broken behavior, regressions, crashes, or reliability problems.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one reproducible problem. Search existing issues first.
        For security vulnerabilities, use the private reporting link instead.
        Media URLs can carry credentials (`?token=`, `?expiry=`); never paste
        signed or private URLs. Redact credentials, cookies, and personal data.

  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, cookies, private media URLs, and personal data.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Myna is affected?
      options:
        - URL entry or native playback
        - HLS playback (native or hls.js)
        - Advanced engine (Mediabunny or WebCodecs)
        - WASM audio codecs (AC-3, E-AC-3, DTS)
        - Media proxy (/api/media-proxy)
        - Subtitles (external or embedded)
        - Track selection or engine migration
        - Player UI or controls
        - CI, release, or operations
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest deterministic sequence that shows the problem.
      placeholder: |
        1. Paste a direct URL to ...
        2. Play ...
        3. Switch audio track ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Myna have done?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include visible error text exactly when possible.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks the main workflow completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: media-shape
    attributes:
      label: Media shape
      description: Optional. Container, codecs, size, and how the file is served (direct link, signed link, HLS). Never include credential-bearing URLs.

  - type: input
    id: version
    attributes:
      label: Myna version or commit
      description: Use the release tag, commit SHA, or branch if known.
      placeholder: v0.1.0 or main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, device, operating system, and network details that matter.
      placeholder: |
        Browser and version:
        Device or operating system:
        Network conditions:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste only relevant output and redact secrets, cookies, URLs, and personal data.
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Add screenshots or a short recording when they clarify the problem. Redact sensitive information first.

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
