name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  HUSKY: 0

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  verify-release-tag:
    name: Verify stable release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check tag ancestry
        env:
          TAG_COMMIT: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unsupported product release tag: ${TAG_NAME}"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Product release tag ${TAG_NAME} does not point to a commit on main"
            exit 1
          fi

  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up pnpm 12 and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.5.1
          runtime: node@26.9.0
          cache: true
          install: false
      - name: Update pnpm
        run: pnpm self-update
      - name: Install the verified dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        run: pnpm check
      - name: Run the test suites
        run: pnpm test
      - name: Build the verified release
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myna-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myna-release-${{ github.sha }}
          path: |
            dist/client
            dist/server
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production
    needs:
      - workflow-security
      - verify-release-tag
      - verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      queue: max
    environment: production
    permissions:
      contents: write
    env:
      COMMIT_HASH: ${{ github.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify production credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production environment secret: ${name}"
              exit 1
            fi
          done

      - name: Set up pnpm 12 and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.5.1
          runtime: node@26.9.0
          cache: true
          install: false

      - name: Update pnpm
        run: pnpm self-update

      - name: Install the verified dependency graph
        run: pnpm install --frozen-lockfile

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myna-release-${{ github.sha }}
          path: dist

      - name: Deploy Myna
        id: deploy_myna
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --config dist/server/wrangler.json
          --env=""
          --message "GitHub ${COMMIT_HASH}"

      # Myna exposes no version endpoint, so verification confirms the
      # deployed Worker serves the app shell, not that this exact commit is
      # live. Add a version endpoint before reusing release-identity checks.
      - name: Verify the Myna deployment is serving
        id: verify_release
        run: |
          for attempt in {1..30}; do
            if curl --fail --show-error --silent --output /dev/null \
              --retry 2 --retry-all-errors \
              "https://myna.dg02002.workers.dev/"; then
              echo "The Myna homepage is healthy (attempt ${attempt}/30)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Myna deployment did not become healthy within the configured verification window."
          exit 1

      - name: Roll back Myna after a post-deployment failure
        if: failure() && steps.deploy_myna.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler rollback
          --config dist/server/wrangler.json
          --env=""
          --message "Automatic rollback after release verification failed for ${COMMIT_HASH}"
          --yes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_notes="$(cat <<EOF
          ## Release

          - Myna: \`${TAG_NAME}\`
          - Commit: \`${GITHUB_SHA}\`
          EOF
          )"

          for attempt in 1 2 3; do
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release ${TAG_NAME} already exists."
              exit 0
            fi

            if gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "$release_notes" \
              --title "Myna $TAG_NAME"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "GitHub Release creation failed on attempt ${attempt}/3; retrying."
              sleep 10
            fi
          done

          echo "::error::GitHub Release ${TAG_NAME} could not be created after 3 attempts."
          exit 1
